name: Build

# Catches a broken commit before it gets tagged. The release workflow only runs once a tag
# exists, and by then a failure means deleting and re-pushing the tag.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # One build has to work on all three systems, so all three compile it. The mac and linux
    # runners will not catch a P/Invoke that names a symbol wrong — that only shows up when
    # the call is made — but they do catch the far more common way a port rots: a path with a
    # backslash in it, or a file that quietly stopped being copied.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build PlugLauncher.slnx -c Release --nologo

      # The release archive is only useful if the plugins land next to the exe, and that
      # relies on a wildcard in the csproj. Cheap to check, annoying to discover later.
      - name: Check the bundled plugins were copied
        shell: pwsh
        run: |
          $output = "src/PlugLauncher.App/bin/Release/net10.0/plugins"
          $count = @(Get-ChildItem $output -Directory -ErrorAction SilentlyContinue).Count
          if ($count -eq 0) { throw "No plugins were copied next to the exe." }

          Write-Host "$count bundled plugin(s)"

      # A launcher outside a bundle is not an application as far as the window server is
      # concerned and the hotkey never registers, so the bundle is part of the build on mac,
      # not a packaging afterthought.
      - name: Build the .app bundle
        if: matrix.os == 'macos-latest'
        run: ./tools/build-mac.sh

      - name: Keep the bundle as an artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: PlugLauncher-macos
          path: publish/PlugLauncher.app
