name: Release

# Pushing a v* tag builds the archive and publishes it as a GitHub release.
# Running it by hand builds the same archive and leaves it as a workflow artifact,
# which is a cheap way to check the release path still works without tagging anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A tag that disagrees with Directory.Build.props would ship an exe stamped with a
      # different number than the release it sits in, so that stops the run right here.
      - name: Read the version and check it against the tag
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if (-not $version) { throw "Directory.Build.props has no <Version>." }

          "value=$version" | Out-File $env:GITHUB_OUTPUT -Append

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/v?', ''
            if ($tag -ne $version) {
              throw "Tag $tag does not match Directory.Build.props version $version. Bump the props file and re-tag."
            }
          }

          Write-Host "Version: $version"

      - name: Build the release archive
        shell: pwsh
        run: ./tools/build-release.ps1

      - name: Extract the release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $lines = Get-Content CHANGELOG.md

          $heading = $lines | Select-String -Pattern "^## $([regex]::Escape($version))\b" | Select-Object -First 1
          if (-not $heading) { throw "CHANGELOG.md has no section for $version." }

          # Select-String line numbers are 1-based, so this already starts after the heading
          $rest = $lines[$heading.LineNumber..($lines.Count - 1)]
          $next = $rest | Select-String -Pattern '^## ' | Select-Object -First 1

          $notes = if ($next -and $next.LineNumber -gt 1) { $rest[0..($next.LineNumber - 2)] }
                   elseif ($next) { @() }
                   else { $rest }

          ($notes -join "`n").Trim() | Out-File release-notes.md -Encoding utf8
          Get-Content release-notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = (Get-ChildItem publish/PlugLauncher-*.zip | Select-Object -First 1).FullName

          gh release create $env:GITHUB_REF_NAME `
            $archive `
            publish/SHA256SUMS.txt `
            --title "PlugLauncher $env:GITHUB_REF_NAME" `
            --notes-file release-notes.md

      - name: Keep the archive as an artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: PlugLauncher-${{ steps.version.outputs.value }}
          path: publish/PlugLauncher-*.zip
